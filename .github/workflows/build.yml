name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      release:
        description: "Also publish a GitHub Release for this build (normally left off)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/kotoba-release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode signing keystore
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > "$KEYSTORE_PATH"

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Get app version
        id: version
        run: echo "APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotoba-apk-${{ env.APP_VERSION }}-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Kotoba v${{ env.APP_VERSION }}
          body: |
            Signed release APK for Kotoba ${{ env.APP_VERSION }}.
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
